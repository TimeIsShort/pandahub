name: Feature Request ✨
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## ✨ Feature Description
        Clearly describe the feature or improvement you'd like to see.

  - type: textarea
    id: problem
    attributes:
      label: "🎯 Problem or Motivation"
      description: "What problem does this solve? Why is it needed?"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "💡 Proposed Solution"
      description: "How should it work? Any specific ideas?"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "🔄 Alternatives Considered"
      description: "Any other approaches you considered?"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: "📎 Additional Context"
      description: "Screenshots, mockups, related links, etc."
    validations:
      required: false

  - type: input
    id: priority
    attributes:
      label: "⚡ Priority"
      description: "How important is this? (P0/P1/P2/P3)"
      placeholder: "P0 / P1 / P2 / P3"
    validations:
      required: false
