name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  api-test:
    name: API Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOME: /home/runner
      CI: "true"
      ACTIONS_ALLOW_UNSECURED_NODE_VERSION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        run: |
          pnpm install --ignore-scripts
          pnpm rebuild better-sqlite3

      - name: Start server
        env:
          NODE_ENV: production
          PORT: 3000
          JWT_SECRET: ci_test_jwt
          VAPID_PUBLIC_KEY: ci_test_pub
          VAPID_PRIVATE_KEY: ci_test_priv
          VAPID_SUBJECT: mailto:test@ci.local
          MINIMAX_API_KEY: ci_dummy_key
          SITE_URL: http://localhost:3000
        run: |
          nohup npm start > /tmp/server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -s http://localhost:3000/api/sections > /dev/null 2>&1 && echo "Server up!" && exit 0
            sleep 2
          done
          echo "=== Server failed ==="
          cat /tmp/server.log
          exit 1

      - name: Smoke API
        run: |
          curl -s http://localhost:3000/api/sections | python3 -c "import sys,json; d=json.load(sys.stdin); print('sections OK:', len(d.get('sections',[])))"
          curl -s http://localhost:3000/api/posts?limit=1 | python3 -c "import sys,json; d=json.load(sys.stdin); print('posts OK:', len(d.get('posts',[])))"
          curl -s http://localhost:3000/api/tags | python3 -c "import sys,json; d=json.load(sys.stdin); print('tags OK:', len(d.get('tags',[])))"
          curl -s http://localhost:3000/api/i18n/t?lang=zh | python3 -c "import sys,json; d=json.load(sys.stdin); print('i18n OK:', d.get('translations',{}).get('site_name','?'))"
          curl -s -o /dev/null -w "index HTTP: %{http_code}" http://localhost:3000/

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build pandahub image
        run: docker build --load -t pandahub:test -f Dockerfile .

      - name: Verify i18n files in image
        run: |
          docker run --rm --entrypoint /bin/sh pandahub:test -c "ls /app/i18n-data/ && test -f /app/i18n-data/zh.json && echo 'i18n OK'" || echo "i18n missing"

      - name: Run pandahub container
        run: |
          docker run -d --name pandahub \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e JWT_SECRET=ci_test_jwt \
            -e VAPID_PUBLIC_KEY=ci_test_pub \
            -e VAPID_PRIVATE_KEY=ci_test_priv \
            -e VAPID_SUBJECT=mailto:test@ci.local \
            -e MINIMAX_API_KEY=ci_dummy_key \
            -e SITE_URL=http://localhost:3000 \
            -p 3000:3000 \
            --health-cmd "wget -qO- http://127.0.0.1:3000/api/sections" \
            --health-interval 10s \
            --health-retries 15 \
            --health-timeout 5s \
            --health-start-period 20s \
            pandahub:test

      - name: Wait for container to be healthy
        run: |
          for i in $(seq 1 40); do
            STATUS=$(docker inspect pandahub --format='{{.State.Health.Status}}' 2>/dev/null || echo "none")
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy"
              exit 0
            fi
            echo "Waiting... ($i/40) status=$STATUS"
            sleep 3
          done
          echo "=== Container logs ==="
          docker logs pandahub
          exit 1

      - name: Verify API
        run: |
          curl -s http://localhost:3000/api/sections | python3 -c "import sys,json; d=json.load(sys.stdin); print('sections OK:', len(d['sections']))"
          curl -s http://localhost:3000/api/i18n/t?lang=zh | python3 -c "import sys,json; d=json.load(sys.stdin); print('i18n OK:', d['translations'].get('site_name'))"

      - name: Cleanup
        if: always()
        run: docker rm -f pandahub || true
