name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      pandahub:
        image: pandahub:latest
        ports:
          - 3000:3000
        env:
          NODE_ENV: production
          PORT: 3000
          JWT_SECRET: ci_test_jwt_secret_${{ github.run_id }}
          VAPID_PUBLIC_KEY: ci_test_vapid_pub_${{ github.run_id }}
          VAPID_PRIVATE_KEY: ci_test_vapid_priv_${{ github.run_id }}
          VAPID_SUBJECT: mailto:test@ci.local
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY || 'ci_dummy_key' }}
          SITE_URL: http://localhost:3000
        options: >-
          --health-cmd "wget -qO- http://localhost:3000/api/sections"
          --health-interval 10s
          --health-retries 10
          --health-timeout 5s
          --health-start-period 15s
        volumes:
          - pandahub-data:/app/data
          - pandahub-uploads:/app/uploads

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke:ci
        env:
          SITE_URL: http://localhost:3000

  api-check:
    name: API Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci --omit=dev

      - name: Start server
        run: |
          npm start &
          sleep 5

      - name: Smoke API calls
        run: |
          curl -s http://localhost:3000/api/sections | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('sections') is not None, 'sections missing'; print('sections OK')"
          curl -s http://localhost:3000/api/posts?limit=1 | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'posts' in d, 'posts missing'; print('posts OK')"
          curl -s http://localhost:3000/api/tags | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'tags' in d, 'tags missing'; print('tags OK')"

volumes:
  pandahub-data:
  pandahub-uploads:
