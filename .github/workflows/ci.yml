name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  api-test:
    name: API Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOME: /home/runner
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install deps
        env:
          CI: "true"
        run: npm install --prefer-offline --no-audit

      - name: Start server
        env:
          NODE_ENV: production
          PORT: 3000
          JWT_SECRET: ci_test_jwt
          VAPID_PUBLIC_KEY: ci_test_pub
          VAPID_PRIVATE_KEY: ci_test_priv
          VAPID_SUBJECT: mailto:test@ci.local
          MINIMAX_API_KEY: ci_dummy_key
          SITE_URL: http://localhost:3000
        run: |
          nohup npm start > /tmp/server.log 2>&1 &
          echo "Waiting for server... (PID $!)"
          for i in $(seq 1 20); do
            if curl -s http://localhost:3000/api/sections > /dev/null 2>&1; then
              echo "Server up after $i attempts!"
              exit 0
            fi
            sleep 2
          done
          echo "=== Server startup failed ==="
          cat /tmp/server.log
          echo "=== Port check ==="
          ss -tlnp | grep 3000 || netstat -tlnp | grep 3000 || echo "Port 3000 not listening"
          exit 1

      - name: Smoke API
        run: |
          echo "=== Testing sections ===" && curl -s http://localhost:3000/api/sections | python3 -c "import sys,json; d=json.load(sys.stdin); print('sections OK:', len(d.get('sections',[])))"
          echo "=== Testing posts ===" && curl -s http://localhost:3000/api/posts?limit=1 | python3 -c "import sys,json; d=json.load(sys.stdin); print('posts OK:', len(d.get('posts',[])))"
          echo "=== Testing tags ===" && curl -s http://localhost:3000/api/tags | python3 -c "import sys,json; d=json.load(sys.stdin); print('tags OK:', len(d.get('tags',[])))"
          echo "=== Testing i18n ===" && curl -s "http://localhost:3000/api/i18n/t?lang=zh" | python3 -c "import sys,json; d=json.load(sys.stdin); print('i18n OK:', d.get('translations',{}).get('site_name','?'))"
          echo "=== Testing index ===" && curl -s -o /dev/null -w "index HTTP: %{http_code}" http://localhost:3000/

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build pandahub image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: pandahub:test
          no-cache: true

      - name: Verify i18n files in image
        run: |
          docker run --rm pandahub:test sh -c "ls /app/i18n-data/ 2>&1 && echo '---i18n-data OK---" || echo 'i18n-data missing'
          docker run --rm pandahub:test sh -c "cat /app/data-wordfilter/word-filter.txt 2>&1 | head -2 || echo 'word-filter missing'"
          docker run --rm pandahub:test sh -c "ls /app/i18n-data/zh.json /app/i18n-data/en.json 2>&1 && echo 'files OK' || echo 'files NOT found'"

      - name: Run pandahub container
        run: |
          docker run -d --name pandahub \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e JWT_SECRET=ci_test_jwt \
            -e VAPID_PUBLIC_KEY=ci_test_pub \
            -e VAPID_PRIVATE_KEY=ci_test_priv \
            -e VAPID_SUBJECT=mailto:test@ci.local \
            -e MINIMAX_API_KEY=ci_dummy_key \
            -e SITE_URL=http://localhost:3000 \
            -p 3000:3000 \
            --health-cmd "wget -qO- http://127.0.0.1:3000/api/sections" \
            --health-interval 10s \
            --health-retries 15 \
            --health-timeout 5s \
            --health-start-period 20s \
            pandahub:test

      - name: Wait for container to be healthy
        run: |
          for i in $(seq 1 40); do
            STATUS=$(docker inspect pandahub --format='{{.State.Health.Status}}' 2>/dev/null || echo "none")
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy"
              exit 0
            fi
            echo "Waiting... ($i/40) status=$STATUS"
            sleep 3
          done
          echo "Container failed to become healthy"
          docker logs pandahub
          exit 1

      - name: Verify API
        run: |
          curl -s http://localhost:3000/api/sections | python3 -c "import sys,json; d=json.load(sys.stdin); print('API sections OK:', len(d['sections']))"
          curl -s http://localhost:3000/api/i18n/t?lang=zh | python3 -c "import sys,json; d=json.load(sys.stdin); print('i18n OK:', d['translations'].get('site_name'))"

      - name: Cleanup
        if: always()
        run: docker rm -f pandahub || true
