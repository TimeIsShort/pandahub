name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build pandahub image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: pandahub:test
          envs: NODE_ENV,PORT

      - name: Run pandahub container
        run: |
          docker run -d --name pandahub \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e JWT_SECRET=ci_test_jwt \
            -e VAPID_PUBLIC_KEY=ci_test_pub \
            -e VAPID_PRIVATE_KEY=ci_test_priv \
            -e VAPID_SUBJECT=mailto:test@ci.local \
            -e MINIMAX_API_KEY=ci_dummy_key \
            -e SITE_URL=http://localhost:3000 \
            -p 3000:3000 \
            --health-cmd "wget -qO- http://127.0.0.1:3000/api/sections" \
            --health-interval 10s \
            --health-retries 15 \
            --health-timeout 5s \
            --health-start-period 20s \
            pandahub:test

      - name: Wait for container to be healthy
        run: |
          for i in $(seq 1 40); do
            STATUS=$(docker inspect pandahub --format='{{.State.Health.Status}}' 2>/dev/null || echo "none")
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy"
              exit 0
            fi
            echo "Waiting... ($i/40) status=$STATUS"
            sleep 3
          done
          echo "Container failed to become healthy"
          docker logs pandahub
          exit 1

      - name: Verify API responds
        run: curl -s http://localhost:3000/api/sections | python3 -c "import sys,json; d=json.load(sys.stdin); print('API OK, sections:', len(d.get('sections',[])))"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke:ci
        env:
          SITE_URL: http://localhost:3000

      - name: Cleanup
        if: always()
        run: docker rm -f pandahub

  api-check:
    name: API Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOME: /home/runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci --omit=dev

      - name: Start server
        env:
          NODE_ENV: production
          PORT: 3000
          JWT_SECRET: ci_test_jwt
          VAPID_PUBLIC_KEY: ci_test_pub
          VAPID_PRIVATE_KEY: ci_test_priv
          VAPID_SUBJECT: mailto:test@ci.local
          MINIMAX_API_KEY: ci_dummy_key
          SITE_URL: http://localhost:3000
        run: |
          npm start &
          sleep 5

      - name: Smoke API calls
        run: |
          curl -s http://localhost:3000/api/sections | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('sections') is not None, 'sections missing'; print('sections OK')"
          curl -s http://localhost:3000/api/posts?limit=1 | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'posts' in d, 'posts missing'; print('posts OK')"
          curl -s http://localhost:3000/api/tags | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'tags' in d, 'tags missing'; print('tags OK')"
